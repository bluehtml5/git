<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>您可能喜歡 — 手機介面演示</title>
<style>
  :root{
    --ink:#1a1a1a; --muted:#8a8a8a; --line:#e3e3e3; --paper:#fff;
    --brand:#1CA9E8;   /* 品牌藍：logo 底、加入購物車、購物車角標、回頂端 */
    --pre:#F5821F;     /* 預售橘 */
    --red:#E8231A;     /* 出貨日期紅框 */
    --green:#1E9E4A;   /* 自取綠 */
    --timer:#6E6E6E;   /* 倒數列灰 */
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:#0d0e11; overflow:hidden;
    font-family:"PingFang TC","Noto Sans TC","Hiragino Sans TC","Microsoft JhengHei",
                Helvetica,Arial,sans-serif;
    color:#fff; display:flex; align-items:center; justify-content:center;
  }

  /* ================= 舞台 540x960 → 錄成 1080x1920 ================= */
  #stage{
    width:540px; height:960px; position:relative; flex:none; overflow:hidden;
    background:radial-gradient(120% 80% at 50% 0%, #23252c 0%, #15161a 55%, #0c0d10 100%);
    transform-origin:center center;
  }
  #stage::after{
    content:""; position:absolute; inset:0; pointer-events:none; opacity:.035;
    background-image:radial-gradient(#fff 1px, transparent 1px); background-size:3px 3px;
  }

  /* ================= 手機 =================
     預設「全出血」：介面填滿整個 1080x1920，不留背景邊。
     app 視窗維持 390 寬（字級、間距才跟真機一致），高度取 9:16 → 693.33，
     再等比放大 540/390 = 1.3846 倍填滿舞台。
     加 ?frame=1 可切回「深色底 + 手機外框」的版本。 */
  #phone{
    position:absolute; left:0; top:0; width:540px; height:960px;
    padding:0; background:none; box-shadow:none;
  }
  #screen{
    position:relative; width:390px; height:693.33px; overflow:hidden;
    background:var(--paper); color:var(--ink);
    display:flex; flex-direction:column;
    transform:scale(1.384615); transform-origin:top left;
  }
  /* 手機外框版 */
  body.framed #phone{
    left:50%; top:56px; width:414px; height:868px; margin-left:-207px;
    transform:scale(.80); transform-origin:top center;
    background:#1c1d21; border-radius:56px; padding:12px;
    box-shadow:0 40px 80px rgba(0,0,0,.55), 0 0 0 2px #34363d inset;
  }
  body.framed #screen{width:390px; height:844px; border-radius:44px; transform:none}

  /* 字卡壓在畫面下方，用漸層壓底確保白字讀得到，但不蓋住 tab bar */
  #scrim{
    position:absolute; left:0; right:0; bottom:88px; height:330px; z-index:30; pointer-events:none;
    background:linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,.55) 30%,
                                          rgba(0,0,0,.82) 62%, rgba(0,0,0,.86) 100%);
    opacity:0; transition:opacity .34s ease;
  }
  #scrim.on{opacity:1}
  body.framed #scrim{display:none}

  .statusbar{
    flex:none; height:44px; display:flex; align-items:flex-end; justify-content:space-between;
    padding:0 26px 4px; font-size:13px; font-weight:600;
  }
  .statusbar .glyphs{display:flex; gap:5px; align-items:center}
  .bar{width:3px; background:var(--ink); border-radius:1px}
  .batt{width:22px; height:11px; border:1.5px solid var(--ink); border-radius:3px; position:relative}
  .batt i{position:absolute; inset:1.5px; width:70%; background:var(--ink); border-radius:1px}
  .batt::after{content:""; position:absolute; right:-4px; top:3px; width:2px; height:5px;
    background:var(--ink); border-radius:0 1px 1px 0}

  /* 固定頁首 */
  .nav{
    flex:none; height:58px; display:flex; align-items:center; gap:12px; padding:0 14px;
    background:var(--paper); border-bottom:1px solid #eee; z-index:6;
  }
  .logo{background:var(--brand); border-radius:2px; padding:7px 10px;
        display:flex; align-items:center; gap:7px; line-height:1}
  .logo .cn{font-size:18px; font-weight:900; color:#FFE500; letter-spacing:2px;
            text-shadow:0 1px 0 rgba(0,0,0,.25)}
  .logo .en{font-size:11px; font-weight:900; color:#fff; letter-spacing:.3px}
  .navicons{margin-left:auto; display:flex; align-items:center; gap:16px}
  .icon{width:23px; height:23px; display:block}
  .cart{position:relative}
  .cart .cnt{
    position:absolute; top:-7px; right:-9px; min-width:18px; height:18px; padding:0 4px;
    background:var(--brand); color:#fff; border-radius:9px; font-size:10.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  .cart .cnt.pop{transform:scale(1.6)}

  #scroller{flex:1; overflow:hidden; position:relative}
  .page{position:absolute; inset:0; overflow:hidden; background:var(--paper)}
  #pageB{transform:translateX(100%); transition:transform .42s cubic-bezier(.4,0,.2,1)}
  #pageB.in{transform:translateX(0)}
  .inner{will-change:transform}

  /* ---------- 頁面內容 ---------- */
  .social{display:flex; justify-content:flex-end; gap:13px; padding:9px 16px}
  .social span{width:21px; height:21px; border-radius:5px; display:flex;
               align-items:center; justify-content:center; font-size:11px; font-weight:800}

  .gallery{position:relative; padding:4px 0 10px}
  .gallery .main{display:flex; align-items:center; justify-content:center; height:250px}
  .gallery .main svg{width:320px}
  .gallery .thumb{position:absolute; right:14px; bottom:4px; width:76px; height:58px;
                  display:flex; align-items:center; justify-content:center; overflow:hidden}
  .gallery .thumb svg{width:74px}

  .ptitle{font-size:22px; font-weight:600; line-height:1.34; padding:6px 14px 0}
  .pricerow{display:flex; align-items:baseline; gap:9px; padding:12px 14px 0; flex-wrap:wrap}
  .price{font-size:15px; font-weight:500}
  .price b{font-size:29px; font-weight:600; letter-spacing:-.5px}
  .price i{font-size:17px; font-style:normal; font-weight:600}
  .pretag{background:var(--pre); color:#fff; font-size:11px; padding:3px 6px; border-radius:2px}

  .ship{display:flex; gap:10px; padding:12px 14px 0}
  .ship div{border:1.5px solid var(--brand); border-radius:2px; padding:5px 8px; font-size:13px;
            color:#1668a8; display:flex; align-items:center; gap:6px}
  .ship div.pick{border-color:var(--green); color:#177c3a}
  .ship .i{width:16px; height:16px; border-radius:50%; background:var(--brand); color:#fff;
           font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center}
  .ship div.pick .i{background:var(--green)}

  .deadline{padding:14px 14px 0; font-size:13px; color:#D2410F; font-weight:600}
  .shipbox{margin:10px 14px 0; background:var(--red); color:#fff; font-size:12px;
           line-height:1.55; padding:8px 10px; border-radius:2px}

  .buyrow{display:flex; align-items:center; gap:12px; padding:16px 14px 0}
  .stepper{display:flex; align-items:center; border:1px solid #ccc; border-radius:3px; overflow:hidden}
  .stepper b{width:32px; height:34px; display:flex; align-items:center; justify-content:center;
             font-size:17px; font-weight:400; background:#fafafa; color:#333}
  .stepper i{width:38px; text-align:center; font-style:normal; font-size:15px}
  .heart{margin-left:2px}
  .addcart{
    margin-left:auto; background:var(--brand); color:#fff; font-size:15px; font-weight:600;
    padding:10px 18px; border-radius:3px; transition:transform .12s ease;
  }
  .addcart.press{transform:scale(.95)}
  .upc{padding:14px 14px 0; font-size:12.5px; color:#444}
  .upc b{font-weight:700}
  .chips{display:flex; flex-wrap:wrap; gap:8px; padding:12px 14px 0}
  .chips span{border:1px solid #d5d5d5; border-radius:3px; padding:4px 9px;
              font-size:12px; color:#333}

  .sechead{margin:20px 14px 0; padding-bottom:10px; border-bottom:1px solid var(--line);
           font-size:15px; letter-spacing:1px}
  .body{padding:14px 14px 0; font-size:14px; line-height:1.85; color:#222}
  .tracks{padding:12px 14px 0; font-size:14px; line-height:2.1; color:#222}
  .tracks h5{font-size:14px; font-weight:600; margin-bottom:2px}

  /* ---------- 您可能喜歡：雙欄網格 ---------- */
  .recs{margin-top:26px; padding-bottom:26px; position:relative}
  .rechead{margin:0 14px; padding-bottom:11px; border-bottom:1px solid var(--line);
           font-size:15px; letter-spacing:1px}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:16px 14px; padding:16px 14px 0}
  .card{opacity:0; transform:translateY(16px);
        transition:opacity .4s ease, transform .4s cubic-bezier(.2,.7,.3,1)}
  .card.show{opacity:1; transform:none}
  .card .pre{display:inline-block; background:var(--pre); color:#fff; font-size:11px;
             font-weight:600; padding:2px 6px; margin-bottom:5px}
  .card .art{position:relative; height:142px; display:flex; align-items:center;
             justify-content:center; overflow:hidden; transition:transform .18s ease}
  .card.tapped .art{transform:scale(.95)}
  .card .art svg{width:152px}
  .card .timer{
    position:absolute; left:0; right:0; bottom:0; background:var(--timer); color:#fff;
    font-size:13px; text-align:center; padding:4px 0; font-variant-numeric:tabular-nums;
  }
  .card .nm{font-size:13.5px; font-weight:700; line-height:1.45; margin-top:9px; height:39px;
            overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
  .card .foot{display:flex; align-items:center; justify-content:space-between; margin-top:6px}
  .card .pr{font-size:12px}
  .card .pr b{font-size:17px; font-weight:600}
  .card .buy{width:38px; height:31px; background:#efefef; border-radius:3px;
             display:flex; align-items:center; justify-content:center}

  /* 後製標註用的高亮框（品牌藍，明顯不是 app 介面的一部分） */
  .ringwrap{position:absolute; left:7px; right:7px; top:-8px; bottom:8px; z-index:3; pointer-events:none}
  .ringwrap i{position:absolute; inset:0; border:3px solid var(--brand); border-radius:8px; opacity:0}
  .recs.lit .ringwrap i{animation:ring 2s ease forwards}
  @keyframes ring{
    0%{opacity:0; transform:scale(1.03)} 20%{opacity:1; transform:scale(1)}
    75%{opacity:1} 100%{opacity:0}
  }

  .bottompad{height:80px}

  /* 底部 tab bar */
  .tabbar{flex:none; height:62px; border-top:1px solid var(--line); background:var(--paper);
          display:flex; align-items:center; justify-content:space-around; padding-bottom:4px; z-index:6}
  .tabbar a{display:flex; flex-direction:column; align-items:center; gap:3px;
            font-size:11px; color:#3a3a3a; letter-spacing:2px}
  .tabbar a.on{color:var(--brand)}
  .tabbar .cart .cnt{top:-6px; right:-10px}

  /* 浮動聯絡鈕 / 回頂端 */
  .contact{position:absolute; right:0; bottom:158px; height:48px; background:rgba(45,45,45,.85);
           color:#fff; display:flex; align-items:center; gap:7px; padding:0 12px 0 5px;
           border-radius:24px 0 0 24px; z-index:8}
  .contact .badge{width:38px; height:38px; border-radius:50%; background:#fff;
                  display:flex; flex-direction:column; align-items:center; justify-content:center;
                  font-size:8px; font-weight:800; line-height:1.2; border:1px solid #e0e0e0}
  .contact .badge em{font-style:normal; color:var(--brand); font-size:9px}
  .contact .badge u{text-decoration:none; color:#e2231a; font-size:6.5px}
  .contact .txt{font-size:14px; letter-spacing:2px}
  /* 全出血版把兩顆浮動鈕往上移，讓出下方的字卡區；?frame=1 維持真實位置 */
  body:not(.framed) .contact{bottom:238px}
  body:not(.framed) .totop{bottom:196px}
  .totop{position:absolute; right:12px; bottom:78px; width:42px; height:42px; background:var(--brand);
         border-radius:3px; display:flex; align-items:center; justify-content:center; z-index:8;
         opacity:0; transition:opacity .3s ease}
  .totop.on{opacity:1}

  /* 手指 */
  #finger{position:absolute; width:44px; height:44px; margin:-22px 0 0 -22px; border-radius:50%;
          background:rgba(20,20,20,.16); border:1.5px solid rgba(20,20,20,.32);
          opacity:0; z-index:40; pointer-events:none}
  #finger.tap{animation:tap .62s ease forwards}
  @keyframes tap{
    0%{opacity:0; transform:scale(1.7)} 30%{opacity:1; transform:scale(1)}
    55%{opacity:1; transform:scale(.78)} 100%{opacity:0; transform:scale(1.5)}
  }

  /* 字卡 */
  #caption{position:absolute; left:30px; right:30px; bottom:132px; z-index:32;
           display:flex; flex-direction:column; align-items:center; gap:9px; text-align:center}
  body.framed #caption{top:788px; bottom:auto; height:136px}
  #caption .kicker{font-size:12px; letter-spacing:4px; color:#d6d9e0; font-weight:600;
                   opacity:0; transition:opacity .3s ease;
                   text-shadow:0 1px 6px rgba(0,0,0,.6)}
  #caption .line{font-size:31px; line-height:1.34; font-weight:700; letter-spacing:.6px;
                 opacity:0; transform:translateY(8px); text-shadow:0 2px 12px rgba(0,0,0,.65);
                 transition:opacity .34s ease, transform .34s cubic-bezier(.2,.7,.3,1)}
  body.framed #caption .kicker{color:#8b8f9a; text-shadow:none}
  body.framed #caption .line{font-size:28px; font-weight:600; text-shadow:none}
  #caption.on .kicker{opacity:1}
  #caption.on .line{opacity:1; transform:none}

  /* 結尾卡：CUBE 片尾的視覺語言（小白字 + 大黃字），之後接真正的品牌片尾 */
  #endcard{position:absolute; inset:0; background:#0c0d10; z-index:60; opacity:0; pointer-events:none;
           display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
           transition:opacity .5s ease}
  #endcard.on{opacity:1}
  #endcard .small{font-size:19px; color:#fff; letter-spacing:2px; opacity:0;
                  transition:opacity .4s ease .1s}
  #endcard .big{font-size:46px; font-weight:800; line-height:1.28; text-align:center;
                color:#FAFB4B; letter-spacing:1px; margin-top:2px;
                opacity:0; transform:translateY(10px);
                transition:opacity .45s ease .25s, transform .45s cubic-bezier(.2,.7,.3,1) .25s}
  #endcard .small2{margin-top:34px}
  #endcard.on .small, #endcard.on .big{opacity:1; transform:none}
  #endcard .big2{transition-delay:.85s}
  #endcard .small2{transition-delay:.7s}

  #hud{position:fixed; left:20px; bottom:18px; font-size:12px; line-height:1.9; color:#767b86;
       font-family:ui-monospace,Menlo,monospace}
  #hud b{color:#c8ccd4}
  body.clean #hud{display:none}
</style>
</head>
<body>

<div id="stage">
  <div id="phone">
    <div id="screen">
      <div class="statusbar">
        <span>9:41</span>
        <span class="glyphs">
          <span class="bar" style="height:6px"></span><span class="bar" style="height:8px"></span>
          <span class="bar" style="height:10px"></span><span class="bar" style="height:12px"></span>
          <span style="width:6px"></span><span class="batt"><i></i></span>
        </span>
      </div>

      <div class="nav">
        <svg class="icon" viewBox="0 0 24 24" stroke="#1a1a1a" stroke-width="1.9" fill="none">
          <path d="M3 6h18M3 12h18M3 18h18" stroke-linecap="round"/></svg>
        <!-- ▼ 佔位造型，正式版請換成真正的 logo 圖檔 -->
        <span class="logo"><span class="cn">歌謠</span><span class="en">KOIO 1985</span></span>
        <span class="navicons">
          <svg class="icon" viewBox="0 0 24 24" stroke="#1a1a1a" stroke-width="1.8" fill="none">
            <circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4" stroke-linecap="round"/></svg>
          <span class="cart">
            <svg class="icon" viewBox="0 0 24 24" stroke="#1a1a1a" stroke-width="1.8" fill="none">
              <path d="M2 3h3l2.4 11.2a1.6 1.6 0 0 0 1.6 1.3h8.6a1.6 1.6 0 0 0 1.6-1.2L21 7H6"
                    stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="10" cy="20" r="1.4" fill="#1a1a1a" stroke="none"/>
              <circle cx="18" cy="20" r="1.4" fill="#1a1a1a" stroke="none"/></svg>
            <b class="cnt" id="cartTop">0</b>
          </span>
          <svg class="icon" viewBox="0 0 24 24" stroke="#1a1a1a" stroke-width="1.7" fill="none">
            <circle cx="12" cy="12" r="9"/>
            <path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3C9 6.5 9 17.5 12 21"/></svg>
        </span>
      </div>

      <div id="scroller">
        <div class="page" id="pageA"><div class="inner"></div></div>
        <div class="page" id="pageB"><div class="inner"></div></div>
      </div>

      <div class="contact">
        <span class="badge"><em>歌謠</em><u>Contact Us</u></span><span class="txt">查詢</span>
      </div>
      <div class="totop" id="toTop">
        <svg width="19" height="19" viewBox="0 0 24 24" stroke="#fff" stroke-width="2.6" fill="none">
          <path d="M12 19V6M5 12l7-7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>

      <div class="tabbar">
        <a class="on"><svg class="icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" fill="none">
          <path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" stroke-linejoin="round"/></svg>首頁</a>
        <a><svg class="icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" fill="none">
          <circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4" stroke-linecap="round"/></svg>搜索</a>
        <a><svg class="icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" fill="none">
          <path d="M12 20s-8-4.6-8-10a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.4-8 10-8 10z" stroke-linejoin="round"/></svg>收藏</a>
        <a><span class="cart">
          <svg class="icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" fill="none">
            <path d="M2 3h3l2.4 11.2a1.6 1.6 0 0 0 1.6 1.3h8.6a1.6 1.6 0 0 0 1.6-1.2L21 7H6"
                  stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="10" cy="20" r="1.3" fill="currentColor" stroke="none"/>
            <circle cx="18" cy="20" r="1.3" fill="currentColor" stroke="none"/></svg>
          <b class="cnt" id="cartTab">0</b></span>購物車</a>
        <a><svg class="icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" fill="none">
          <circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r="1" fill="currentColor" stroke="none"/>
          <circle cx="15" cy="10" r="1" fill="currentColor" stroke="none"/>
          <path d="M8.5 14.5c1 1.2 2.2 1.8 3.5 1.8s2.5-.6 3.5-1.8" stroke-linecap="round"/></svg>帳號</a>
      </div>

      <div id="finger"></div>
    </div>
  </div>

  <div id="scrim"></div>
  <div id="caption"><div class="kicker"></div><div class="line"></div></div>

  <!-- 這張卡是接進 CUBE 正式片尾前的橋接卡：說清楚「上了什麼」，
       品牌訊息交給後面接上的真實片尾（finish.sh 會接） -->
  <div id="endcard">
    <div class="small">CUBE.mo 開店平台　商品頁新功能</div>
    <div class="big">您可能喜歡</div>
    <div class="small small2">同專輯其他版本、同歌手其他作品</div>
    <div class="big big2">自動推薦</div>
  </div>
</div>

<div id="hud"><b>space</b> 重播　<b>c</b> 錄影模式　<b>1</b> 半速</div>

<script>
/* ==========================================================================
   「您可能喜歡...」相關商品推薦 — 手機介面演示
   依實際商品頁重建：固定頁首、預售橘標、倒數灰列、藍色加入購物車、
   紅色出貨日期框、標籤 chips、底部五格 tab bar、浮動查詢鈕。
   舞台 540x960 → 錄成 1080x1920，約 19 秒循環。

   刻意的取捨：手機畫面內只重現真實存在的元素。推薦邏輯（同專輯其他版本 /
   同歌手其他作品）用字卡說明，不在卡片上加網站沒有的標籤，避免影片演示到
   不存在的功能。高亮框用品牌藍，讀起來是後製標註而不是 app 介面。
   ========================================================================== */

/* ---------- 商品資料（封面為抽象佔位圖，正式版換成真實商品照） ---------- */
const PRODUCT = {
  title:'Michael Jackson - THRILLER 1982, Red & Black Marble 紅色和黑色大理石 LP',
  price:'280', upc:'199584611211',
  art:{sleeve:'#101a2c', ink:'#ece6da', disc:'#8d1420', disc2:'#2b0c10'}
};
/* 被點進去的那一張 —— 必須和分鏡中被點的卡片一致（預設 RECS[1]） */
const PRODUCT_B = {
  title:'Michael Jackson - THRILLER 1982 Golden Pearl 金色珍珠 LP',
  price:'350', upc:'199584611228',
  art:{sleeve:'#101a2c', ink:'#ece6da', disc:'#efece4', disc2:'#bdb6a7'}
};
const RECS = [
  {title:'Michael Jackson - THRILLER 1982, Black Liquid 官方限量液態黑膠 LP',
   price:'950', days:3,
   art:{sleeve:'#101a2c', ink:'#ece6da', disc:'#141414', disc2:'#f4f4f4'}},
  {title:'Michael Jackson - THRILLER 1982 Golden Pearl 金色珍珠 LP',
   price:'350', days:19,
   art:{sleeve:'#101a2c', ink:'#ece6da', disc:'#efece4', disc2:'#bdb6a7'}},
  {title:'Michael Jackson - THRILLER Gold Metallic Cassette 限量版',
   price:'180', days:3,
   art:{sleeve:'#f4f2ed', ink:'#c1121f', disc:'#c9a227', cassette:true}},
  {title:'Daniel Caesar – Case Study 01, Transparent Blue LP',
   price:'385', days:8,
   art:{sleeve:'#c9d2dc', ink:'#6d7885', disc:'#a2b5cb', disc2:'#7c92ad'}},
];

/* ---------- 封面插圖 ---------- */
let uid = 0;
function art(a){
  const id = 'g' + (++uid);
  const obj = a.cassette ? `
    <g transform="translate(166,102)">
      <rect x="-54" y="-35" width="108" height="70" rx="5" fill="${a.disc}"/>
      <rect x="-42" y="-25" width="84" height="27" rx="3" fill="rgba(255,255,255,.5)"/>
      <circle cx="-19" cy="13" r="12" fill="#fff" opacity=".85"/>
      <circle cx="19" cy="13" r="12" fill="#fff" opacity=".85"/>
      <circle cx="-19" cy="13" r="4.5" fill="${a.disc}"/><circle cx="19" cy="13" r="4.5" fill="${a.disc}"/>
    </g>` : `
    <g transform="translate(168,102)">
      <circle r="78" fill="url(#${id})"/>
      <g fill="none" stroke="rgba(0,0,0,.15)" stroke-width="1">
        <circle r="68"/><circle r="58"/><circle r="48"/><circle r="38"/>
      </g>
      <circle r="25" fill="#1d3557"/><circle r="25" fill="none" stroke="rgba(255,255,255,.22)"/>
      <circle r="2.6" fill="#fff"/>
    </g>`;

  return `<svg viewBox="0 0 270 205" xmlns="http://www.w3.org/2000/svg">
    <defs><radialGradient id="${id}" cx="38%" cy="30%">
      <stop offset="0%" stop-color="${a.disc}"/>
      <stop offset="52%" stop-color="${a.disc2 || a.disc}"/>
      <stop offset="100%" stop-color="${a.disc}"/>
    </radialGradient></defs>
    ${obj}
    <g>
      <rect x="8" y="16" width="172" height="172" fill="${a.sleeve}"/>
      <circle cx="128" cy="72" r="42" fill="${a.ink}" opacity=".9"/>
      <path d="M8 150 180 96 180 132 8 188Z" fill="${a.ink}" opacity=".5"/>
      <rect x="22" y="32" width="62" height="5" rx="2.5" fill="${a.ink}" opacity=".85"/>
      <rect x="22" y="45" width="40" height="5" rx="2.5" fill="${a.ink}" opacity=".55"/>
      <rect x="8" y="16" width="172" height="172" fill="none" stroke="rgba(0,0,0,.1)"/>
    </g>
  </svg>`;
}

const cartSvg = c => `<svg width="18" height="18" viewBox="0 0 24 24" stroke="${c}"
  stroke-width="1.8" fill="none">
  <path d="M2 3h3l2.4 11.2a1.6 1.6 0 0 0 1.6 1.3h8.6a1.6 1.6 0 0 0 1.6-1.2L21 7H6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="10" cy="20" r="1.3" fill="${c}" stroke="none"/>
  <circle cx="18" cy="20" r="1.3" fill="${c}" stroke="none"/></svg>`;

/* ---------- 版型 ---------- */
function cards(){
  return RECS.map((r, i) => `
    <div class="card" data-i="${i}">
      <div><span class="pre">預售</span></div>
      <div class="art">${art(r.art)}<span class="timer" data-days="${r.days}">--日--:--:--</span></div>
      <div class="nm">${r.title}</div>
      <div class="foot">
        <span class="pr">MOP <b>${r.price}</b>.00</span>
        <span class="buy">${cartSvg('#333')}</span>
      </div>
    </div>`).join('');
}

function pdp(p){
  return `
    <div class="social">
      <span style="background:#1877F2;color:#fff">f</span>
      <span style="background:linear-gradient(45deg,#F9CE34,#EE2A7B,#6228D7);color:#fff">◎</span>
      <span style="background:#FF2741;color:#fff">书</span>
      <span style="background:#111;color:#fff">♪</span>
    </div>
    <div class="gallery">
      <div class="main">${art(p.art)}</div>
      <div class="thumb">${art(p.art)}</div>
    </div>
    <h1 class="ptitle">${p.title}</h1>
    <div class="pricerow">
      <span class="price">MOP <b>${p.price}</b><i>.00</i></span>
      <span class="pretag">預售類別結帳</span>
    </div>
    <div class="ship">
      <div class="pick">自取 <span class="i">i</span></div>
      <div>順豐速運 送內地及香港 <span class="i">i</span></div>
    </div>
    <div class="deadline">⏱ 此商品將於 2026年8月31日前截單！</div>
    <div class="shipbox">預計出貨日期: 26年11月（根據訂單順序，陸續出貨）*　［最終以代理商交付運輸為準］</div>
    <div class="buyrow">
      <span class="stepper"><b>−</b><i>1</i><b>+</b></span>
      <svg class="icon heart" viewBox="0 0 24 24" stroke="#555" stroke-width="1.7" fill="none">
        <path d="M12 20s-8-4.6-8-10a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.4-8 10-8 10z"
              stroke-linejoin="round"/></svg>
      <span class="addcart">加入購物車</span>
    </div>
    <div class="upc">UPC: <b>${p.upc}</b></div>
    <div class="chips"><span>預訂 Preorder</span><span>Michael Jackson</span></div>
    <div class="sechead">商品介紹</div>
    <div class="body">
      流行樂壇奉為「King Of Pop」的超級天王麥可傑克森，1982 年推出重量級專輯
      Thriller，專輯獲得滾石雜誌 5 顆星評價，及 83 年葛萊美獎「最佳年度專輯」等 8 項大獎，
      在流行榜上創下超過 4 千萬張銷售奇蹟。
    </div>
    <div class="tracks">
      <h5>TRACKLIST：</h5>
      <div>SIDE A</div>
      <div>1. Wanna Be Startin' Somethin'</div>
      <div>2. Baby Be Mine</div>
      <div>3. The Girl Is Mine</div>
      <div>4. Thriller</div>
    </div>
    <div class="recs">
      <div class="ringwrap"><i></i></div>
      <div class="rechead">您可能喜歡...</div>
      <div class="grid">${cards()}</div>
    </div>
    <div class="bottompad"></div>`;
}

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const pageA = $('#pageA'), pageB = $('#pageB');
pageA.querySelector('.inner').innerHTML = pdp(PRODUCT);
pageB.querySelector('.inner').innerHTML = pdp(PRODUCT_B);

/* ---------- 預售倒數：真的在走 ---------- */
const pad = n => String(n).padStart(2, '0');
const start = Date.now();
setInterval(() => {
  const gone = (Date.now() - start) / 1000;
  $$('.timer').forEach(el => {
    let t = (+el.dataset.days) * 86400 + 7*3600 + 50*60 + 57 - gone;
    if (t < 0) t = 0;
    el.textContent = `${pad(Math.floor(t / 86400))}日${pad(Math.floor(t % 86400 / 3600))}:` +
                     `${pad(Math.floor(t % 3600 / 60))}:${pad(Math.floor(t % 60))}`;
  });
}, 250);

/* ---------- 動畫工具 ---------- */
const ONCE = new URLSearchParams(location.search).has('once');
let speed = 1;
const wait = ms => new Promise(r => setTimeout(r, ms / speed));
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;

function tween(dur, fn){
  return new Promise(res => {
    const t0 = performance.now(), d = dur / speed;
    (function step(now){
      const k = Math.min(1, (now - t0) / d);
      fn(ease(k));
      k < 1 ? requestAnimationFrame(step) : res();
    })(t0);
  });
}
function scrollTo(page, to, dur){
  const inner = page.querySelector('.inner');
  const from = parseFloat(inner.dataset.y || 0);
  inner.dataset.y = to;
  return tween(dur, k => inner.style.transform = `translateY(${from + (to - from) * k}px)`);
}
function setScroll(page, y){
  const inner = page.querySelector('.inner');
  inner.dataset.y = y; inner.style.transform = `translateY(${y}px)`;
}
/* 捲到某個元素，pad 是元素距畫面頂端要留的距離 —— 版面改了不用重算數字 */
function scrollToEl(page, el, pad, dur){
  return scrollTo(page, -(el.offsetTop - pad), dur);
}
function tap(x, y){
  const f = $('#finger');
  f.style.left = x + 'px'; f.style.top = y + 'px';
  f.classList.remove('tap'); void f.offsetWidth; f.classList.add('tap');
  return wait(420);
}
function tapEl(el){
  const s = $('#screen').getBoundingClientRect(), r = el.getBoundingClientRect();
  const k = s.width / 390;
  return tap((r.left + r.width/2 - s.left) / k, (r.top + r.height/2 - s.top) / k);
}
function caption(kicker, line){
  const c = $('#caption');
  c.classList.remove('on');
  $('#scrim').classList.add('on');
  setTimeout(() => {
    c.querySelector('.kicker').textContent = kicker;
    c.querySelector('.line').innerHTML = line;
    c.classList.add('on');
  }, 220 / speed);
}
function captionOff(){
  $('#caption').classList.remove('on');
  $('#scrim').classList.remove('on');
}
function setCart(n, pop){
  ['#cartTop', '#cartTab'].forEach(s => {
    const el = $(s); el.textContent = n;
    if (pop){ el.classList.add('pop'); setTimeout(() => el.classList.remove('pop'), 280 / speed); }
  });
}

/* ---------- 分鏡 ---------- */
async function play(){
  $('#endcard').classList.remove('on');
  pageB.classList.remove('in');
  $('#toTop').classList.remove('on');
  setCart(0);
  setScroll(pageA, 0); setScroll(pageB, 0);
  $$('.card').forEach(c => c.classList.remove('show','tapped'));
  pageB.querySelectorAll('.card').forEach(c => c.classList.add('show'));
  $$('.recs').forEach(r => r.classList.remove('lit'));
  captionOff();
  await wait(400);

  const recsA  = pageA.querySelector('.recs');
  const cardsA = [...pageA.querySelectorAll('.card')];

  /* 1 — 熟悉的商品頁 */
  caption('', '一樣的商品頁');
  await wait(2000);

  /* 2 — 往下滑，經過商品介紹與曲目 */
  caption('', '往下滑，看看有什麼不一樣');
  await scrollToEl(pageA, pageA.querySelector('.sechead'), 120, 1100);
  $('#toTop').classList.add('on');
  await wait(600);

  /* 3 — 「您可能喜歡...」出現 */
  caption('', '新功能<br>您可能喜歡');
  await scrollToEl(pageA, recsA, 40, 1000);
  recsA.classList.add('lit');
  cardsA.forEach((c, i) => setTimeout(() => c.classList.add('show'), i * 120 / speed));
  await wait(2200);

  /* 4 — 推薦邏輯 */
  caption('', '同一張專輯的其他版本<br>同歌手的其他作品');
  await scrollToEl(pageA, recsA, -120, 900);
  await wait(1700);

  /* 5 — 預售倒數 */
  caption('', '預售倒數　同步顯示');
  await wait(1700);

  /* 6 — 點卡片跳頁 */
  caption('', '點進去，不必回搜尋');
  const target = cardsA[1];
  await tapEl(target.querySelector('.art'));
  target.classList.add('tapped');
  await wait(160);
  target.classList.remove('tapped');
  setScroll(pageB, 0);
  pageB.classList.add('in');
  await wait(1700);

  /* 7 — 加入購物車 */
  caption('', '看到喜歡的，直接加入購物車');
  await scrollToEl(pageB, pageB.querySelector('.buyrow'), 260, 900);
  const btn = pageB.querySelector('.addcart');
  await tapEl(btn);
  btn.classList.add('press');
  await wait(140);
  btn.classList.remove('press');
  setCart(1, true);
  await wait(1800);

  /* 8 — 結尾卡 */
  captionOff();
  await wait(300);
  $('#endcard').classList.add('on');
  if (ONCE) return;                // 錄影時停在結尾卡，不要循環回開頭
  await wait(2600);
  $('#endcard').classList.remove('on');
  await wait(700);
}

let running = false;
async function loop(){
  if (running) return;
  running = true;
  do { await play(); } while (!ONCE);
}

function fit(){
  $('#stage').style.transform = `scale(${Math.min(innerWidth / 540, innerHeight / 960)})`;
}
addEventListener('resize', fit);
fit();

addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); location.reload(); }
  if (e.key === 'c') document.body.classList.toggle('clean');
  if (e.key === '1') speed = speed === 1 ? .5 : 1;
});
const q = new URLSearchParams(location.search);
if (q.has('clean')) document.body.classList.add('clean');
/* ?frame=1 —— 切回「深色底 + 手機外框」的版本；預設是全出血 */
if (q.has('frame')) document.body.classList.add('framed');
/* ?once=1 —— 播一輪就停在結尾卡（錄影用）；不加則無限循環（預覽用） */

(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(loop));
</script>
</body>
</html>
