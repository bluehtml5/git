  report_output_dir: "reports"
  db_path: "data/hsi_analysis.db"
  cache_dir: "data/cache"

futures:
  hsi_ticker: "^HSI"
  hsi_futures_front: "HSI=F"
  mini_futures_front: "MHI=F"
  a50_ticker: "XU050=F"
  hstech_ticker: "^HSTECH"
  vix_ticker: "^VIX"
